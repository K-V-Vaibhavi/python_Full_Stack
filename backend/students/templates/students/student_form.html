<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Login</title>
</head>
<body>
    <div class="login-box">
        <h2 style="color:blue; background-color:pink;">Student Login</h2>
        {%if error%}
        <p class="error">{{error}}</p>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <label>Username</label>
            <input type="text"
            name="username"
            placeholder="Enter Username"
            required>
            <label>Password:</label>
            <input type="password"
            name="password"
            placeholder="Enter Password"
            required>
            <button type="submit">Login</button>

        </form>
    </div>



</body>
</html>
